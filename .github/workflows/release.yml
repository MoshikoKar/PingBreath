# Push a tag like v0.1.1 (matching Cargo.toml) to build and publish a release.
# The in-app updater downloads NetPulse-Setup.exe / NetPulse-portable.zip from the latest release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sums = Get-Content dist/SHA256SUMS.txt -Raw
          @"
          ## Downloads
          - **NetPulse-Setup.exe** - installer (per-user, optional start with Windows)
          - **NetPulse-portable.zip** - no install; settings kept next to the exe

          ## SHA-256
          ``````
          $sums
          ``````
          "@ -replace '(?m)^ {10}','' | Set-Content notes.md
          gh release create "${{ github.ref_name }}" dist/NetPulse-Setup.exe dist/NetPulse-portable.zip dist/SHA256SUMS.txt --title "NetPulse ${{ github.ref_name }}" --notes-file notes.md --generate-notes
